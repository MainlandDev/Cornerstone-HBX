<div class="cart-total-value">
    <button
        class="coupon-code-add"
        aria-label="{{lang "cart.coupons.add_coupon"}}"
        aria-controls="add-coupon"
        aria-expanded="false"
    >{{lang "cart.coupons.add_coupon"}}</button>
    <button
        class="coupon-code-cancel"
        style="display:none"
        aria-label="{{lang "cart.coupons.add_coupon"}}"
        aria-controls="add-coupon"
        aria-expanded="true"
    >{{lang "cart.coupons.cancel"}}</button>
</div>
<div
    id="add-coupon"
    class="cart-form coupon-code"
    aria-hidden="true"
    style="display:none"
>
    <form
        class="form form--hiddenLabels coupon-form"
        action="{{urls.cart}}"
        method="post"
    >
        <label class="form-label" for="couponcode">{{lang "cart.coupons.coupon_code"}}</label>
        <input
            class="form-input"
            data-error="{{lang "cart.coupons.empty_error"}}"
            id="couponcode"
            type="text"
            placeholder="{{lang "cart.coupons.coupon_code"}}"
            name="couponcode"
            value=""
        >
        <input
            class="button button--primary button--small"
            type="submit"
            aria-label="{{lang "cart.coupons.apply_coupon"}}"
            value="{{lang "cart.coupons.button"}}"
        >
        <input
            type="hidden"
            name="action"
            value="applycoupon"
        >
    </form>
</div>
