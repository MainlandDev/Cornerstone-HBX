<form
    action="{{urls.cart}}"
    encType="multipart/form-data"
    method="post"
>
    <input
        type="hidden"
        name="item_id"
        value="{{item.id}}"
    />
    <p> Options</p>
    {{#each product.options}}
        <div>{{{dynamicComponent "components/products/options"}}}</div>
    {{/each}}
    <input
        type="submit"
        class="btn btn-success"
        value="Save"
    />
</form>
