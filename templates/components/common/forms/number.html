<div
    class="form-field"
    id="{{id}}"
    data-validation="{{validation}}"
>
    <label class="form-label" for="{{id}}_input">
        {{label}}
        {{#if required}}
            <small>{{lang "common.required"}}</small>
        {{/if}}
    </label>
    <input
        type="number"
        class="form-input"
        data-label="{{label}}"
        data-input
        data-rule="lowerThan"
        min="{{limitfrom}}"
        max="{{limitto}}"
        title="{{lang "forms.range" limitFrom=limitfrom limitTo=limitto}}"
        id="{{id}}_input"
        aria-required="{{required}}"
        aria-labelledby="{{id}}"
        aria-live="polite"
        name="{{name}}"
        value="{{value}}"
        {{#if private_id}}data-field-type="{{private_id}}"{{/if}}
    >
</div>
