{{#unless value}}
    <option value="">---</option>
    {{#each items}}
        <option value="{{value}}">{{label}}</option>
    {{/each}}
{{else}}
    {{#unless isRequired}}
        <option value="">---</option>
    {{/unless}}
    {{#each items}}
        <option {{#if ../this.value "==" value}}selected {{/if}} value="{{value}}">{{label}}</option>
    {{/each}}
{{/unless}}
