<div class="form-field" data-product-attribute="input-number">
    <label
        class="form-label form-label--alternate form-label--inlineSmall"
        for="attribute_number_{{id}}"
    >{{display_name}}:
        {{> "components/common/requireness-msg"}}
    </label>
    <input
        class="form-input"
        type="number"
        id="attribute_number_{{id}}"
        {{#unless integer_only}}step="any"{{/unless}}
        name="attribute[{{id}}]"
        value="{{prefill}}"
        {{#if required}}required{{/if}}
    >
</div>
